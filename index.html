<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Busta Paga</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #payslip { border: 1px solid #ccc; padding: 15px; max-width: 600px; }
    h2, h3 { color: #333; }
    ul { list-style-type: none; padding: 0; }
    li { margin: 5px 0; }
    .netto { font-weight: bold; font-size: 1.2em; }
  </style>
</head>
<body>

  <div id="payslip">
    <h2>Contratto: XXXX</h2>
    <p>Ore ordinarie: <span id="oN"></span>, Ore notturne: <span id="tN"></span>, Ora straordinaria: <span id="sM"></span></p>
    
    <h3>Competenze (Lordo)</h3>
    <ul>
      <li>Base: <span id="cB"></span></li>
      <li>Ora straordinaria: <span id="extraStraordinario"></span></li>
      <li>Ore notturne: <span id="extraNotturno"></span></li>
      <li>Festività: <span id="extraFestivo"></span></li>
      <li>Weekend: <span id="extraRiposo"></span></li>
      <li>Totale Lordo: <span id="gross"></span></li>
    </ul>

    <h3>Trattenute</h3>
    <ul>
      <li>INPS: <span id="inps"></span></li>
      <li>IRPEF: <span id="irpef"></span></li>
      <li>Altre: <span id="otherDeductions"></span></li>
      <li>Totale Trattenute: <span id="trattenute"></span></li>
    </ul>

    <h3>Netto</h3>
    <p class="netto"><span id="net"></span></p>
  </div>

  <script>
    // Dati di esempio (aggiustare in base al caso specifico)
    const oN = 160; // Ore ordinarie
    const tN = 20;  // Ore notturne
    const sM = 10;  // Ora straordinaria
    const extraRiposo = 4; // Ore weekend
    const cB = 7.33335; // Stipendio orario base
    const cFissoFestivo = 50; // Bonus festivo fisso

    // Calcolo componenti variabili (Competenze)
    const extraStraordinario = sM * cB * 0.20; // 20% straordinario
    const extraNotturno = tN * cB * 0.30; // 30% notturno
    const extraFestivo = sM * cB * 0.20; // 20% festivo (esempio)
    const extraDomenica = extraRiposo * cB * 0.50; // 50% weekend

    // Totale lordo (GROSS)
    const gross = cB * oN + extraStraordinario + extraNotturno + extraDomenica + extraFestivo + cFissoFestivo;

    // Calcolo trattenute
    const inps = gross * 0.20; // 20% INPS
    const irpef = gross * 0.25; // 25% IRPEF
    const otherDeductions = gross * 0.05; // 5% altre trattenute
    const trattenute = inps + irpef + otherDeductions;

    // Calcolo netto (con arrotondamento)
    const net = (gross - trattenute).toFixed(2);
    const roundedNet = parseFloat(net).toFixed(2);

    // Aggiornamento UI
    document.getElementById("oN").textContent = oN;
    document.getElementById("tN").textContent = tN;
    document.getElementById("sM").textContent = sM;
    document.getElementById("cB").textContent = gross.toFixed(2);
    document.getElementById("extraStraordinario").textContent = extraStraordinario.toFixed(2);
    document.getElementById("extraNotturno").textContent = extraNotturno.toFixed(2);
    document.getElementById("extraFestivo").textContent = (extraFestivo + cFissoFestivo).toFixed(2);
    document.getElementById("extraRiposo").textContent = extraDomenica.toFixed(2);
    document.getElementById("gross").textContent = gross.toFixed(2);
    document.getElementById("inps").textContent = inps.toFixed(2);
    document.getElementById("irpef").textContent = irpef.toFixed(2);
    document.getElementById("otherDeductions").textContent = otherDeductions.toFixed(2);
    document.getElementById("trattenute").textContent = trattenute.toFixed(2);
    document.getElementById("net").textContent = roundedNet;
  </script>

</body>
</html>
